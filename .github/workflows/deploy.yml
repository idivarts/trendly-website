name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # NEXT_PUBLIC_* values are inlined at build time, so they must be set
        # here — a static export has no server to read them at runtime.
        # This workflow only ever builds prod (it triggers on `main`), so there
        # is a single key. Point it at the SAME project as the brand app's
        # production key: both sites are on *.trendly.now and share one
        # distinct_id, which is what makes visitor → signup one funnel.
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY_PROD }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Marketing pixels — public identifiers, so repo/org variables rather
          # than secrets. Unset ones are skipped at render time.
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID_WEBSITE }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ vars.LINKEDIN_PARTNER_ID }}
          NEXT_PUBLIC_TWITTER_PIXEL_ID: ${{ vars.TWITTER_PIXEL_ID }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.CLARITY_PROJECT_ID }}
        run: npx next build

      - name: Verify build output
        run: |
          test -f out/index.html || (echo "out/index.html missing — build failed" && exit 1)
          echo "HTML pages: $(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "Export size: $(du -sh out | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload static assets (1-year cache)
        run: |
          aws s3 sync out/_next/ s3://${{ vars.S3_BUCKET }}/_next/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Upload HTML pages (no-cache)
        run: |
          aws s3 sync out/ s3://${{ vars.S3_BUCKET }}/ \
            --delete \
            --exclude "_next/*" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, no-cache, must-revalidate" \
            --metadata-directive REPLACE

      - name: Upload SEO & root files (1-hour cache)
        run: |
          aws s3 sync out/ s3://${{ vars.S3_BUCKET }}/ \
            --exclude "_next/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text
